name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: bookshelf-linux-x64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: bookshelf-windows-x64.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist

          Copy-Item "target/${{ matrix.target }}/release/bookshelf.exe" dist/
          Copy-Item "lib/windows/*.dll" dist/

          Compress-Archive -Path dist/* `
            -DestinationPath "${{ matrix.archive }}" -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist

          cp target/${{ matrix.target }}/release/bookshelf dist/
          cp lib/linux/*.so dist/

          tar -czf "${{ matrix.archive }}" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
